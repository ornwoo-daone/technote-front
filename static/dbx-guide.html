<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Tech Note</title>
<!-- 레거시 URL 호환. 예전 홈(dbx-guide.html)과 카테고리 페이지(<cat>/index.html)를 북마크해 둔
     경우를 위해 남긴다. 레거시 경로는 <cat>/index.html 이고 React 는 #/<cat> 이라 해시로 옮긴다. -->
<script>
  (function () {
    var m = /\/([a-z0-9]+)\/index\.html/i.exec(location.pathname);
    location.replace('/#/' + (m ? m[1] : ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=/#/">
</head>
<body>
<p>새 주소로 이동합니다 — <a href="/#/">Tech Note</a></p>
</body>
</html>
